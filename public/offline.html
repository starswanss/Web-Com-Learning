<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ออฟไลน์ — LMS ม.3</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;
      background:#020617;color:#cbd5e1;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .box{text-align:center;padding:2rem}
    .icon{font-size:3rem}
    h1{font-size:1.1rem;color:#f1f5f9;margin:.75rem 0 .25rem}
    p{font-size:.85rem;color:#64748b;margin:.25rem 0}
    button{margin-top:1.25rem;border:1px solid #334155;background:#1e293b;color:#e2e8f0;
      padding:.6rem 1.25rem;border-radius:.75rem;font-size:.85rem;cursor:pointer}
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>ออฟไลน์อยู่</h1>
    <p>ไม่สามารถเชื่อมต่ออินเทอร์เน็ตได้</p>
    <p>กรุณาตรวจสอบการเชื่อมต่อแล้วลองใหม่อีกครั้ง</p>
    <button onclick="location.reload()">ลองใหม่</button>
  </div>
</body>
</html>
